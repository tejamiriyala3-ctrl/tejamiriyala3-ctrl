<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="VSS Teja: AI/ML engineer focused on computer vision and generative AI, and a footballer"><title>VSS Teja: AI/ML engineer focused on computer vision and generative AI, and a footballer</title><style>
:root{--bg:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--soft:rgba(31,35,40,.06);--tile:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#30363d;--soft:rgba(255,255,255,.07);--tile:#f0f3f6}}
