.ink{fill:var(--ink)} .mute{fill:var(--mute)} .bgf{fill:var(--bg)} .pn{fill:var(--panel)} .sf{fill:var(--soft)} .tile{fill:var(--tile)}
.ln{stroke:var(--line)} .inks{stroke:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.2}}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
@keyframes shine{from{transform:translateX(-140px)}to{transform:translateX(300px)}}
@keyframes blink{50%{opacity:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.pl{animation:pulse 2.2s ease-in-out infinite}
.ar{animation:nudge 2.4s ease-in-out infinite}
