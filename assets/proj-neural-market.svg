<svg xmlns="http://www.w3.org/2000/svg" width="590" height="200" viewBox="0 0 590 200" role="img" aria-label="Neural Market: Stock price forecasting with a 60-day-lookback LSTM, served in a Streamlit app on live data."><title>Neural Market: Stock price forecasting with a 60-day-lookback LSTM, served in a Streamlit app on live data.</title><style>
:root{--bg:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--soft:rgba(31,35,40,.06);--tile:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#30363d;--soft:rgba(255,255,255,.07);--tile:#f0f3f6}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, monospace}
.ink{fill:var(--ink)} .mute{fill:var(--mute)} .bgf{fill:var(--bg)} .pn{fill:var(--panel)} .sf{fill:var(--soft)} .tile{fill:var(--tile)}
.ln{stroke:var(--line)} .inks{stroke:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.2}}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
@keyframes shine{from{transform:translateX(-140px)}to{transform:translateX(300px)}}
@keyframes blink{50%{opacity:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.pl{animation:pulse 2.2s ease-in-out infinite}
.ar{animation:nudge 2.4s ease-in-out infinite}
