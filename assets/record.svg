<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Football record: national competitions, captaincy, AIFF licence, Telangana Police Games"><title>Football record: national competitions, captaincy, AIFF licence, Telangana Police Games</title><style>
:root{--bg:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--soft:rgba(31,35,40,.06);--tile:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#30363d;--soft:rgba(255,255,255,.07);--tile:#f0f3f6}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, monospace}
.ink{fill:var(--ink)} .mute{fill:var(--mute)} .bgf{fill:var(--bg)} .pn{fill:var(--panel)} .sf{fill:var(--soft)} .tile{fill:var(--tile)}
.ln{stroke:var(--line)} .inks{stroke:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.2}}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
@keyframes shine{from{transform:translateX(-140px)}to{transform:translateX(300px)}}
@keyframes blink{50%{opacity:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.pl{animation:pulse 2.2s ease-in-out infinite}
.ar{animation:nudge 2.4s ease-in-out infinite}
</style><rect x="0.5" y="0.5" width="1199" height="249" rx="16" class="bgf ln" stroke-width="1"/><g class="r"><text x="56" y="54" class="mute m" font-size="12" letter-spacing="3.4">OFF THE PITCH</text></g><text x="1144" y="54" text-anchor="end" class="mute m" font-size="12">Indian Futsal Team Camp · 2019</text><line x1="56" y1="72" x2="1144" y2="72" class="ln" stroke-width="1"/><g class="r" style="animation-delay:0.15s"><text x="56.0" y="150" class="ink" font-size="50" font-weight="700" letter-spacing="-1">3</text><text x="56.0" y="177" class="ink" font-size="14.5" font-weight="600">consecutive national-level</text><text x="56.0" y="198" class="mute" font-size="13">competitions for Telangana, 2016–18</text></g><g class="r" style="animation-delay:0.27s"><line x1="327.0" y1="96" x2="327.0" y2="214" class="ln" stroke-width="1"/><text x="356.0" y="150" class="ink" font-size="50" font-weight="700" letter-spacing="-1">All</text><text x="356.0" y="177" class="ink" font-size="14.5" font-weight="600">levels captained</text><text x="356.0" y="198" class="mute" font-size="13">school, college &amp; university football</text></g><g class="r" style="animation-delay:0.39s"><line x1="599.0" y1="96" x2="599.0" y2="214" class="ln" stroke-width="1"/><text x="628.0" y="150" class="ink" font-size="50" font-weight="700" letter-spacing="-1">AIFF</text><text x="628.0" y="177" class="ink" font-size="14.5" font-weight="600">licensed match official</text><text x="628.0" y="198" class="mute" font-size="13">referee &amp; match commissioner</text></g><g class="r" style="animation-delay:0.51s"><line x1="871.0" y1="96" x2="871.0" y2="214" class="ln" stroke-width="1"/><text x="900.0" y="150" class="ink" font-size="50" font-weight="700" letter-spacing="-1">5th</text><text x="900.0" y="177" class="ink" font-size="14.5" font-weight="600">Telangana Police Games</text><text x="900.0" y="198" class="mute" font-size="13">Match Commissioner &amp; Chief Referee</text></g></svg>
