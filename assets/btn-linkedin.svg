<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 300 60" role="img" aria-label="LinkedIn connect with me"><title>LinkedIn connect with me</title><style>
:root{--bg:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--soft:rgba(31,35,40,.06);--tile:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#30363d;--soft:rgba(255,255,255,.07);--tile:#f0f3f6}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, monospace}
.ink{fill:var(--ink)} .mute{fill:var(--mute)} .bgf{fill:var(--bg)} .pn{fill:var(--panel)} .sf{fill:var(--soft)} .tile{fill:var(--tile)}
.ln{stroke:var(--line)} .inks{stroke:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.2}}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
@keyframes shine{from{transform:translateX(-140px)}to{transform:translateX(300px)}}
@keyframes blink{50%{opacity:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.pl{animation:pulse 2.2s ease-in-out infinite}
.ar{animation:nudge 2.4s ease-in-out infinite}
</style><rect x="0.5" y="0.5" width="299" height="59" rx="30" class="ink" stroke-width="1"/><clipPath id="bc"><rect x="0.5" y="0.5" width="299" height="59" rx="30"/></clipPath><g clip-path="url(#bc)"><g class="shine-g"><rect x="0" y="0" width="60" height="60" fill="#fff" fill-opacity="0.18" transform="skewX(-20)"><animateTransform attributeName="transform" type="translate" values="-90,0;340,0" dur="3.6s" repeatCount="indefinite" additive="sum"/></rect></g></g><text x="28" y="28" class="bgf" font-size="17" font-weight="600">LinkedIn</text><text x="28" y="46" class="bgf m" font-size="11" fill-opacity="0.7">connect with me</text><g class="ar"><path d="M258 22 h14 v14 M272 22 l-17 17" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
